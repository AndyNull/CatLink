server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    root /usr/share/nginx/html;
    gzip_static on;
    gzip_vary on;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /admin-api/ { proxy_pass http://backend:8000; }
    location /api/ { proxy_pass http://backend:8000; }
    location ^~ /static/ { proxy_pass http://backend:8000; }
    location ^~ /uploads/ { proxy_pass http://backend:8000; }
    location /share/ { proxy_pass http://backend:8000; }
    location /healthz { proxy_pass http://backend:8000; }
    location /readyz { proxy_pass http://backend:8000; }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/(?:js|css|svg|png|jpg|jpeg|gif|webp|woff|woff2)/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / { try_files $uri $uri/ /index.html; }
}
